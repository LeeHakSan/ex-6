<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>계획·실행·돌아보기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="authScreen" class="auth-screen">
  <div class="auth-box">
    <div class="brand">
      <span class="brand-mark">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/>
        </svg>
      </span>
      <h1>계획 · 실행 · 돌아보기</h1>
    </div>
    <div class="auth-tabs">
      <button id="authTabLogin" class="auth-tab active" type="button">로그인</button>
      <button id="authTabSignup" class="auth-tab" type="button">회원가입</button>
    </div>
    <form id="loginForm" class="auth-form" method="post" action=".">
      <label>이메일<input type="email" name="email" required autocomplete="username"></label>
      <label>비밀번호<input type="password" name="password" required autocomplete="current-password"></label>
      <button type="submit">로그인</button>
    </form>
    <form id="signupForm" class="auth-form" method="post" action="." hidden>
      <label>이메일<input type="email" name="email" required autocomplete="username"></label>
      <label>비밀번호
        <input type="password" name="password" required minlength="8" autocomplete="new-password">
        <span class="field-hint">8자 이상, 특수문자(!@#$%^&* 등) 1개 이상 포함</span>
      </label>
      <label>비밀번호 확인<input type="password" name="password2" required autocomplete="new-password"></label>
      <button type="submit">회원가입</button>
    </form>
    <p id="authError" class="auth-error" hidden></p>
    <p id="authSuccess" class="auth-success" hidden></p>
  </div>
</div>

<div id="appRoot" hidden>

<header class="app-header">
  <div class="brand">
    <span class="brand-mark">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/>
      </svg>
    </span>
    <h1>계획 · 실행 · 돌아보기</h1>
  </div>
  <div class="header-controls">
    <label for="planSelect">현재 계획</label>
    <select id="planSelect"></select>
    <button id="exportBtn" type="button">내 데이터 내보내기</button>
    <span id="userEmailLabel" class="user-email"></span>
    <button id="logoutBtn" type="button">로그아웃</button>
    <button id="deleteAccountBtn" type="button" class="btn-delete">계정 삭제</button>
  </div>
</header>

<nav class="tabs">
  <button id="tab-plans" class="tab active" type="button">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1"/><path d="M9 11h6M9 15h6M9 19h3"/>
    </svg>
    계획
  </button>
  <button id="tab-todos" class="tab" type="button">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12.5l2.5 2.5L16 9"/>
    </svg>
    할 일
  </button>
  <button id="tab-review" class="tab" type="button">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 20V11M12 20V4M20 20v-6"/>
    </svg>
    돌아보기
  </button>
</nav>

<main>
  <section id="panel-plans" class="panel active">
    <h2 id="planFormTitle">새 계획 만들기</h2>
    <form id="planForm" class="form-grid">
      <input type="hidden" id="planEditingId">
      <label>제목<input name="title" required></label>
      <label>우선순위
        <select name="priority">
          <option value="high">높음</option>
          <option value="medium" selected>중간</option>
          <option value="low">낮음</option>
        </select>
      </label>
      <label>시작일<input type="date" name="period_start" required></label>
      <label>종료일<input type="date" name="period_end" required></label>
      <label>예상 시간(분)<input type="number" name="estimated_minutes" min="0" value="0"></label>
      <label>성공 기준<textarea name="success_criteria" required placeholder="무엇을 이루면 성공인지"></textarea></label>
      <label style="grid-column:1/-1">이전 계획에서 넘어온 메모(자동으로 채워짐, 수정 가능)
        <textarea id="carriedOverNote"></textarea>
      </label>
      <div class="form-actions">
        <button type="submit">저장</button>
        <button type="button" id="planFormCancel">취소</button>
      </div>
    </form>

    <h2>내 계획 목록</h2>
    <div id="plansList"></div>
  </section>

  <section id="panel-todos" class="panel">
    <h2 id="todoFormTitle">새 할 일 만들기</h2>
    <form id="todoForm" class="form-grid">
      <input type="hidden" id="todoEditingId">
      <label>제목<input name="title" required></label>
      <label>우선순위
        <select name="priority">
          <option value="high">높음</option>
          <option value="medium" selected>중간</option>
          <option value="low">낮음</option>
        </select>
      </label>
      <label>마감일<input type="datetime-local" name="deadline"></label>
      <label>예상 시간(분)<input type="number" name="estimated_minutes" min="0" value="0"></label>
      <label>태그(쉼표로 구분)<input name="tags" placeholder="예: 운동, 아침"></label>
      <label style="grid-column:1/-1">설명<textarea name="description"></textarea></label>
      <div class="form-actions">
        <button type="submit">저장</button>
        <button type="button" id="todoFormCancel">취소</button>
      </div>
    </form>

    <div class="toolbar">
      <input id="todoSearch" type="search" placeholder="검색 (제목/설명/태그)">
      <select id="todoStatusFilter">
        <option value="all">전체 상태</option>
        <option value="in_progress">진행 중</option>
        <option value="completed">완료</option>
      </select>
      <select id="todoSort">
        <option value="deadline_asc">마감일 빠른 순</option>
        <option value="deadline_desc">마감일 늦은 순</option>
        <option value="priority_desc">우선순위 높은 순</option>
        <option value="estimated_desc">예상 시간 많은 순</option>
        <option value="created_desc">최근 만든 순</option>
      </select>
    </div>
    <p id="todoSortLabel" class="sort-label"></p>
    <div id="todosList"></div>
  </section>

  <section id="panel-review" class="panel">
    <h2>돌아보기</h2>
    <div id="reviewSummary"></div>
    <form id="retroForm" class="form-grid">
      <label style="grid-column:1/-1">이번 계획에서 다음으로 넘길 고칠 점 한 가지
        <textarea id="retroNoteInput"></textarea>
      </label>
      <div class="form-actions"><button type="submit">저장</button></div>
    </form>
  </section>
</main>

<div id="todoDetailModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="todoDetailTitle">실행 기록</h3>
      <button id="todoDetailClose" class="modal-close" type="button">닫기</button>
    </div>
    <div id="executionLogsList"></div>
    <h4>실행 기록 추가</h4>
    <form id="executionLogForm" class="form-grid">
      <label>시작 시각<input type="datetime-local" name="started_at" required></label>
      <label>끝난 시각<input type="datetime-local" name="ended_at" required></label>
      <label style="grid-column:1/-1">막혔던 이유(있다면)<input name="blocked_reason"></label>
      <div class="form-actions"><button type="submit">기록 저장</button></div>
    </form>
  </div>
</div>

</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
